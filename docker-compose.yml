services:

  postgres:
    image: postgres:18
    container_name: postgres-container
    environment:
      POSTGRES_DB: ems
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    image: employee-management-backend
    container_name: employee-management-container
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres-data: